# ==============================================================================
# Production Docker Compose Architecture for YourTech Solutions
# Services: PostgreSQL 16 + Express API Backend + React Nginx Frontend
# Run: docker compose up -d --build
# ==============================================================================

version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: yourtech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yourtech_secure_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-yourtech_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yourtech_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yourtech-network

  # 2. Express Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: yourtech-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-yourtech_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-yourtech_db}?schema=public
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      ENQUIRY_RATE_LIMIT_MAX: 10
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NOTIFICATION_TO: ${NOTIFICATION_TO:-contact@yourtechsolutions.com}
    volumes:
      - backend_data:/app/server/data
    networks:
      - yourtech-network
    expose:
      - "5000"

  # 3. React Frontend with Nginx Reverse Proxy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: yourtech-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - yourtech-network

volumes:
  postgres_data:
    driver: local
  backend_data:
    driver: local

networks:
  yourtech-network:
    driver: bridge
